[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "anthropic==0.58.2",
    "sentence-transformers==5.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.7",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Keep the lint surface focused on real bugs and import hygiene rather than
# reformatting concerns already owned by black.
select = ["E", "F", "I", "W"]
ignore = [
    "E501", # line length is enforced by black
]

[tool.ruff.lint.per-file-ignores]
# The warnings.filterwarnings() call must run before the fastapi/chromadb
# import chain to suppress a noisy resource_tracker warning at import time,
# so the imports below it are intentionally not at the very top of the file.
"backend/app.py" = ["E402"]

[tool.ruff.lint.isort]
# backend/*.py are flat modules imported by bare name (the app is run from
# inside backend/, not as an installed package) - tell isort's grouping
# about them so they sort after third-party imports instead of alongside them.
known-first-party = [
    "ai_generator",
    "app",
    "config",
    "document_processor",
    "models",
    "rag_system",
    "search_tools",
    "session_manager",
    "vector_store",
]
